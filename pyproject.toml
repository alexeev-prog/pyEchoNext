[project]
name = "pyechonext"
version = "0.8.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Alexeev Bronislav", email = "alexeev.dev@mail.ru" }]
requires-python = ">=3.13"
dependencies = [
    "echonextdi>=0.2.0",
    "gunicorn>=26.0.0",
    "hermes-langlib>=0.1.4",
    "jinja2>=3.1.6",
    "pyjwt>=2.13.0",
    "pysocks>=1.7.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "toml>=0.10.2",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "furo>=2025.12.19",
    "git-cliff>=2.13.1",
    "mutmut>=3.6.0",
    "mypy>=2.3.0",
    "nox>=2026.8.17",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.22",
    "sphinx>=9.1.0",
    "sphinx-polyversion>=2.0.0",
    "wemake-python-styleguide>=1.6.2",
]
